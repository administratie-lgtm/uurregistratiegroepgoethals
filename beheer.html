<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://aalyfgtulrlmpkegkzub.supabase.co", SUPABASE_KEY="sb_publishable_bkZUQu-mzukYkvwfQHzPhw_Z9I84E0c";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY), $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let me,mensen=[],plaatsen=[],msg=null;
const geenLogin=e=>!e||e.endsWith("@geen-login.invalid");
const opt=(arr,sel,leeg)=>(leeg?`<option value="">${leeg}</option>`:"")+arr.map(([v,t])=>`<option value="${v}" ${v===sel?"selected":""}>${esc(t)}</option>`).join("");
async function init(){const{data:{session}}=await db.auth.getSession();if(!session)return login();me=session.user;await load();render()}
function login(){$("app").innerHTML=`<div class="card"><h3>Aanmelden als admin</h3><label>E-mail</label><input id="em" type="email"><label>Wachtwoord</label><input id="pw" type="password"><button onclick="inlog()">Aanmelden</button><div id="lm"></div></div>`}
async function inlog(){const{error}=await db.auth.signInWithPassword({email:$("em").value,password:$("pw").value});if(error)$("lm").innerHTML=`<div class="msg bad">${esc(error.message)}</div>`;else init()}
async function load(){const[a,b]=await Promise.all([db.from("profiles").select("id,naam,email,rol,manager_id,standaard_plaats_id,badge_actief,bedrijf").order("naam"),db.from("plaatsen").select("id,naam,type").in("type",["start","stal"]).order("naam")]);mensen=a.data||[];plaatsen=b.data||[]}
async function fn(body){const{data,error}=await db.functions.invoke("beheer-medewerkers",{body});
 if(error){let t=error.message;try{t=(await error.context.json()).fout||t}catch{}return{fout:t}}return data}
async function klaar(r,ok){msg=r&&r.fout?{c:"bad",t:r.fout}:{c:"ok",t:ok};await load();render()}
async function voegToe(){
 const v={actie:"toevoegen",naam:$("n_naam").value.trim(),email:$("n_em").value.trim(),rol:$("n_rol").value,standaard_plaats_id:$("n_pl").value,manager_id:$("n_mg").value,pin:$("n_pin").value.trim(),bedrijf:$("n_bedrijf").value.trim()};
 if(!v.naam){msg={c:"bad",t:"Vul een naam in."};return render()}
 const email=v.email;
 const r=await fn(v);
 await klaar(r,email?"Uitnodiging verstuurd naar "+email+". Die persoon kiest zelf een wachtwoord.":"Medewerker aangemaakt (enkel tablet). Druk de badge af via badges.html.")}
async function upd(id,veld,val){const{error}=await db.from("profiles").update({[veld]:val||null}).eq("id",id);await klaar(error?{fout:error.message}:null,"Opgeslagen")}
async function hernoem(id){const n=prompt("Nieuwe naam");if(!n||!n.trim())return;await upd(id,"naam",n.trim())}
async function pin(id){const p=prompt("Nieuwe pincode (4 tot 6 cijfers)");if(!p)return;const{error}=await db.rpc("zet_pin",{p_uid:id,p_pin:p});await klaar(error?{fout:error.message}:null,"Pincode ingesteld")}
async function badge(id){if(!confirm("Nieuwe badge maken? De oude badge werkt dan niet meer."))return;const{error}=await db.rpc("nieuwe_badge",{p_uid:id});await klaar(error?{fout:error.message}:null,"Nieuwe badge aangemaakt. Druk hem af via badges.html.")}
async function mailToevoegen(id){const e=prompt("E-mailadres van deze medewerker");if(!e)return;await klaar(await fn({actie:"email_toevoegen",id,email:e}),"E-mailadres toegevoegd en uitnodiging verstuurd.")}
async function mailOpnieuw(id){await klaar(await fn({actie:"mail_opnieuw",id}),"Mail om een wachtwoord te kiezen is opnieuw verstuurd.")}
async function link(id){const r=await fn({actie:"link",id});if(r.fout){msg={c:"bad",t:r.fout}}else{let k="";try{await navigator.clipboard.writeText(r.link);k="Link gekopieerd. "}catch{}msg={c:"ok",t:k+"Stuur deze persoonlijke link door (geldig ongeveer 1 uur, werkt één keer): "+r.link}}render()}
async function actief(id,a){if(!a&&!confirm("Deze medewerker uitschakelen? Badge en login werken dan niet meer."))return;await klaar(await fn({actie:"actief",id,actief:a}),a?"Ingeschakeld":"Uitgeschakeld")}
function render(){const mij=mensen.find(m=>m.id===me.id);
 if(!mij||mij.rol!=="admin"){$("app").innerHTML=`<div class="card">Enkel beheerders hebben toegang tot deze pagina.<br><button onclick="db.auth.signOut().then(login)">Afmelden</button></div>`;return}
 const P=plaatsen.map(p=>[p.id,p.naam]),M=mensen.filter(m=>m.rol!=="medewerker").map(m=>[m.id,m.naam]);
 $("app").innerHTML=`${msg?`<div class="msg ${msg.c}">${esc(msg.t)}</div>`:""}
 <div class="card"><h3 style="margin-top:0">Nieuwe medewerker</h3><div class="g">
 <div><label>Naam</label><input id="n_naam"></div>
 <div><label>E-mail (leeg laten = enkel tablet)</label><input id="n_em" type="email"></div>
 <div><label>Rol</label><select id="n_rol">${opt([["medewerker","Medewerker"],["manager","Manager"],["admin","Admin"]],"medewerker")}</select></div>
 <div><label>Startplaats</label><select id="n_pl">${opt(P,"","— geen vaste —")}</select></div>
 <div><label>Manager</label><select id="n_mg">${opt(M,"","— geen —")}</select></div>
 <div><label>Bedrijf</label><input id="n_bedrijf"></div>
 <div><label>Pincode (optioneel)</label><input id="n_pin" inputmode="numeric" maxlength="6"></div></div>
 <button onclick="voegToe()">Toevoegen</button><div class="mu">Met e-mail: de medewerker krijgt een link en kiest zelf een wachtwoord.</div></div>
 ${mensen.map(m=>{const gl=geenLogin(m.email),zelf=m.id===me.id;return `<div class="card"><b>${esc(m.naam)}</b> ${gl?'<span class="tag u">enkel tablet</span>':`<span class="tag">${esc(m.email)}</span>`}${m.badge_actief?"":' <span class="tag u">uitgeschakeld</span>'}
 <div class="g" style="margin-top:8px"><div><label>Rol</label><select ${zelf?"disabled":""} onchange="upd('${m.id}','rol',this.value)">${opt([["medewerker","Medewerker"],["manager","Manager"],["admin","Admin"]],m.rol)}</select></div>
 <div><label>Startplaats</label><select onchange="upd('${m.id}','standaard_plaats_id',this.value)">${opt(P,m.standaard_plaats_id,"— geen vaste —")}</select></div>
 <div><label>Manager</label><select onchange="upd('${m.id}','manager_id',this.value)">${opt(M.filter(x=>x[0]!==m.id),m.manager_id,"— geen —")}</select></div>
 <div><label>Bedrijf</label><input value="${esc(m.bedrijf||'')}" onchange="upd('${m.id}','bedrijf',this.value)"></div></div>
 <button class="s" onclick="hernoem('${m.id}')">Naam wijzigen</button><button class="s" onclick="pin('${m.id}')">Pincode</button><button class="s" onclick="badge('${m.id}')">Nieuwe badge</button>
 ${gl?`<button class="s" onclick="mailToevoegen('${m.id}')">E-mail toevoegen</button>`:`<button class="s" onclick="mailOpnieuw('${m.id}')">Wachtwoordmail opnieuw</button><button class="s" onclick="link('${m.id}')">Link kopiëren</button>`}
 ${zelf?"":m.badge_actief?`<button class="s d" onclick="actief('${m.id}',false)">Uitschakelen</button>`:`<button class="s" onclick="actief('${m.id}',true)">Inschakelen</button>`}</div>`}).join("")}
 <button class="s" onclick="db.auth.signOut().then(login)">Afmelden</button>`}
init();
</script></body></html>
